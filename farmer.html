<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>のんびり農園インクリメンタル（市場相場連動・ゆったり版）</title>
  <style>
    * { box-sizing: border-box; user-select: none; touch-action: manipulation; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #14281d;
      color: #f0fdf4;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px;
      gap: 16px;
    }
    header {
      width: 100%;
      max-width: 920px;
      background: #1f3a2c;
      border: 2px solid #3f624d;
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .money-box {
      font-size: 26px;
      font-weight: bold;
      color: #fde047;
    }
    .token-box {
      font-size: 18px;
      font-weight: bold;
      color: #fbbf24;
      margin-top: 2px;
    }
    .market-box {
      font-size: 13px;
      color: #e2e8f0;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 8px 12px;
      line-height: 1.5;
    }
    .m-boom { color: #4ade80; font-weight: bold; }
    .m-crash { color: #f87171; font-weight: bold; }
    .m-normal { color: #fde047; font-weight: bold; }
    .sub-stats {
      font-size: 13px;
      color: #bbf7d0;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .layout {
      width: 100%;
      max-width: 920px;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 16px;
    }
    @media (max-width: 780px) {
      .layout { grid-template-columns: 1fr; }
    }
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel {
      background: #1f3a2c;
      border: 2px solid #3f624d;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel.prestige-panel {
      border-color: #d97706;
      background: #232b1d;
    }
    .panel h2 {
      margin: 0;
      font-size: 17px;
      border-bottom: 1px solid #3f624d;
      padding-bottom: 8px;
    }
    .prestige-panel h2 {
      border-bottom-color: #92400e;
      color: #fde68a;
    }
    .seed-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .seed-btn {
      flex: 1;
      min-width: 92px;
      padding: 8px 6px;
      border: 2px solid #4b735b;
      border-radius: 8px;
      background: #14281d;
      color: #dcfce7;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }
    .seed-btn.active {
      border-color: #fde047;
      background: #2d523e;
      font-weight: bold;
    }
    .seed-btn.golden {
      border-color: #f59e0b;
    }
    .seed-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .farm-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .plot {
      aspect-ratio: 1 / 1;
      background: #5c3a21;
      border: 3px solid #3e2513;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      padding: 6px;
      transition: transform 0.06s, border-color 0.15s;
    }
    .plot:active { transform: scale(0.96); }
    .plot.locked {
      background: #182b21;
      border: 2px dashed #4b735b;
      color: #86efac;
      font-size: 12px;
      text-align: center;
    }
    .plot.growing {
      cursor: default;
    }
    .plot.ready {
      border-color: #fde047;
      box-shadow: 0 0 12px rgba(253, 224, 71, 0.45);
      background: #6e4628;
    }
    .crop-icon {
      font-size: 32px;
      line-height: 1.1;
    }
    .crop-label {
      font-size: 11px;
      margin-top: 4px;
      color: #fef3c7;
      font-weight: bold;
    }
    .prog-bar {
      width: 85%;
      height: 6px;
      background: rgba(0,0,0,0.45);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .prog-fill {
      height: 100%;
      width: 0%;
      background: #4ade80;
    }
    .upgrade-item {
      background: #14281d;
      border: 1px solid #3f624d;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .prestige-panel .upgrade-item {
      background: #182015;
      border-color: #78350f;
    }
    .up-info { font-size: 13px; }
    .up-title { font-weight: bold; color: #f0fdf4; }
    .up-desc { font-size: 11px; color: #a7f3d0; margin-top: 2px; }
    .prestige-panel .up-desc { color: #fcd34d; }
    .buy-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #eab308;
      color: #1c1917;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .buy-btn.token-btn {
      background: #f59e0b;
      color: #1c1917;
    }
    .buy-btn:disabled {
      background: #374151;
      color: #9ca3af;
      cursor: not-allowed;
    }
    .prestige-box {
      background: rgba(120, 53, 15, 0.35);
      border: 1px solid #b45309;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }
    .prestige-btn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #f59e0b, #eab308);
      color: #1c1917;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .prestige-btn:disabled {
      background: #374151;
      color: #9ca3af;
      cursor: not-allowed;
    }
    .floating-text {
      position: fixed;
      pointer-events: none;
      color: #fde047;
      font-weight: bold;
      font-size: 16px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      animation: floatUp 0.8s ease-out forwards;
      z-index: 100;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-32px); }
    }
    .footer-tools {
      font-size: 12px;
      color: #86efac;
    }
    .footer-tools button {
      background: transparent;
      border: 1px solid #4b735b;
      color: #bbf7d0;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div style="font-size:12px; color:#a7f3d0;">所持金</div>
      <div class="money-box">💰 <span id="money">10</span> G</div>
      <div class="token-box">🪙 黄金トークン: <span id="tokens">0</span> 枚（転生 <span id="prestigeCount">0</span>回）</div>
    </div>

    <div class="market-box">
      <div>📈 市場トレンド: <span id="marketMood" class="m-normal">通常相場</span></div>
      <div>相場倍率: <strong id="marketIndex">1.00</strong> 倍（0.55〜1.85倍）</div>
      <div style="font-size:11px; color:#94a3b8;">BTC参考: $<span id="btcRef">60,400</span></div>
    </div>

    <div class="sub-stats">
      <div>累計収穫: <strong id="totalHarvest">0</strong>個</div>
      <div>成長速度: <strong id="speedMult">1.00</strong>倍</div>
      <div>合計売値倍率: <strong id="priceMult">1.00</strong>倍</div>
    </div>
  </header>

  <div class="layout">
    <!-- 左：畑エリア -->
    <div class="panel">
      <h2>🌱 あなたの畑（ワンクリックで種まき＆収穫）</h2>

      <div>
        <div style="font-size:12px; color:#a7f3d0; margin-bottom:6px;">植える種を選ぶ：</div>
        <div id="seedSelector" class="seed-selector"></div>
      </div>

      <div id="farmGrid" class="farm-grid"></div>
    </div>

    <!-- 右：通常アップグレード＆転生・トークン交換 -->
    <div class="right-col">
      <div class="panel">
        <h2>🚜 農園アップグレード</h2>
        <div id="upgradeList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>

      <div class="panel prestige-panel">
        <h2>✨ 転生＆黄金トークン交換</h2>

        <div class="prestige-box">
          <div>
            次の転生基準: <strong id="prestigeReq">3,500</strong> G（累計獲得: <strong id="runEarned">0</strong> G）
          </div>
          <div>
            今転生すると獲得できるトークン: <strong id="gainTokens">0</strong> 枚
          </div>
          <button id="prestigeBtn" class="prestige-btn" disabled>転生してトークンを獲得する</button>
        </div>

        <div id="tokenShopList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    </div>
  </div>

  <div class="footer-tools">
    進行状況は自動保存されます ｜ <button id="resetSaveBtn">データを最初からやり直す</button>
  </div>

  <script>
    const CROPS = [
      { id: "radish",  name: "ラディッシュ", seedIcon: "🌱", grownIcon: "🥗", seedCost: 2,    basePrice: 5,     growTime: 7.0,   unlockCost: 0,     requiresTokenCrop: false },
      { id: "carrot",  name: "ニンジン",     seedIcon: "🌿", grownIcon: "🥕", seedCost: 18,   basePrice: 38,    growTime: 14.0,  unlockCost: 120,   requiresTokenCrop: false },
      { id: "tomato",  name: "トマト",       seedIcon: "🪴", grownIcon: "🍅", seedCost: 90,   basePrice: 195,   growTime: 22.0,  unlockCost: 650,   requiresTokenCrop: false },
      { id: "corn",    name: "トウモロコシ", seedIcon: "🌾", grownIcon: "🌽", seedCost: 450,  basePrice: 980,   growTime: 32.0,  unlockCost: 2800,  requiresTokenCrop: false },
      { id: "melon",   name: "高級メロン",   seedIcon: "🍀", grownIcon: "🍈", seedCost: 2200, basePrice: 4900,  growTime: 45.0,  unlockCost: 14000, requiresTokenCrop: false },
      { id: "golden",  name: "黄金イモ",     seedIcon: "✨", grownIcon: "👑", seedCost: 80,   basePrice: 360,   growTime: 12.0,  unlockCost: 0,     requiresTokenCrop: true }
    ];

    const PLOT_COSTS = [0, 45, 180, 650, 2000, 6000, 18000, 50000, 140000];
    const SAVE_KEY = "incremental_farm_market_v1";

    // 変動幅が大きい市場トレンド指数（0.55倍〜1.85倍）
    let marketIndex = 1.0;
    let marketVelocity = 0.03;
    let btcPriceUsd = 60400;

    function createDefaultState() {
      return {
        money: 10,
        runEarned: 10,
        totalHarvest: 0,
        prestigeCount: 0,
        tokens: 0,
        selectedCrop: "radish",
        unlockedCrops: ["radish"],
        unlockedPlots: 1,
        plots: Array.from({ length: 9 }, () => ({ cropId: null, progress: 0 })),
        upgrades: {
          fertilizer: 0,
          market: 0,
          autoPlanter: 0,
          autoHarvester: 0
        },
        tokenPerks: {
          goldenCrop: false,
          fastDrone: false,
          startCashLv: 0
        }
      };
    }

    let state = createDefaultState();
    let isPointerDown = false;
    window.addEventListener("pointerdown", () => { isPointerDown = true; });
    window.addEventListener("pointerup", () => { isPointerDown = false; });

    function stepMarketIndex() {
      // ランダムな波と慣性を組み合わせて大きく上下させる
      const shock = (Math.random() - 0.49) * 0.14;
      const pullToCenter = (1.05 - marketIndex) * 0.05;
      marketVelocity = marketVelocity * 0.75 + shock + pullToCenter;
      marketIndex = Math.max(0.55, Math.min(1.85, Number((marketIndex + marketVelocity).toFixed(2))));

      // 参考表示用のBTC価格も連動して動かす
      btcPriceUsd = Math.max(25000, Math.min(150000, Math.round(60400 * marketIndex)));
    }

    async function fetchBtcReference() {
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
        if (!res.ok) return;
        const data = await res.json();
        const usd = data && data.bitcoin && data.bitcoin.usd;
        if (typeof usd === "number" && usd > 1000) {
          btcPriceUsd = Math.round(usd);
          renderMarketHeader();
        }
      } catch (e) {}
    }

    function loadGame() {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      try {
        const def = createDefaultState();
        const parsed = JSON.parse(raw);
        state = {
          ...def,
          ...parsed,
          upgrades: { ...def.upgrades, ...(parsed.upgrades || {}) },
          tokenPerks: { ...def.tokenPerks, ...(parsed.tokenPerks || {}) }
        };
        if (!Array.isArray(state.plots) || state.plots.length !== 9) {
          state.plots = def.plots;
        }
      } catch (e) {}
    }

    function saveGame() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function formatNum(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
      if (n >= 1e4) return (n / 1e3).toFixed(1) + "K";
      return Math.floor(n).toLocaleString();
    }

    function getPrestigeRequirement() {
      return Math.round(3500 * Math.pow(2.1, state.prestigeCount));
    }

    function calculateGainTokens() {
      const req = getPrestigeRequirement();
      if (state.runEarned < req) return 0;
      const ratio = state.runEarned / req;
      return Math.max(1, Math.floor(Math.pow(ratio, 0.4)));
    }

    function getSpeedMultiplier() {
      return 1 + state.upgrades.fertilizer * 0.12;
    }

    function getPriceMultiplier() {
      const marketUpgradeMult = 1 + state.upgrades.market * 0.15;
      const tokenBonusMult = 1 + state.tokens * 0.10;
      return marketUpgradeMult * tokenBonusMult * marketIndex;
    }

    function getCropSellPrice(crop) {
      return Math.max(1, Math.round(crop.basePrice * getPriceMultiplier()));
    }

    function getCrop(id) {
      return CROPS.find(c => c.id === id);
    }

    function isCropAvailable(crop) {
      if (crop.requiresTokenCrop) {
        return Boolean(state.tokenPerks.goldenCrop);
      }
      return state.unlockedCrops.includes(crop.id);
    }

    function spawnFloatText(x, y, text) {
      const el = document.createElement("div");
      el.className = "floating-text";
      el.textContent = text;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function plantAt(index, silent = false) {
      if (index >= state.unlockedPlots) return false;
      const plot = state.plots[index];
      if (plot.cropId !== null) return false;

      const crop = getCrop(state.selectedCrop);
      if (!crop || !isCropAvailable(crop) || state.money < crop.seedCost) return false;

      state.money -= crop.seedCost;
      plot.cropId = crop.id;
      plot.progress = 0;
      if (!silent) render();
      return true;
    }

    function harvestAt(index, clientX = null, clientY = null) {
      const plot = state.plots[index];
      if (!plot.cropId || plot.progress < 1) return false;

      const crop = getCrop(plot.cropId);
      const earned = getCropSellPrice(crop);
      state.money += earned;
      state.runEarned += earned;
      state.totalHarvest += 1;
      plot.cropId = null;
      plot.progress = 0;

      if (clientX !== null && clientY !== null) {
        spawnFloatText(clientX, clientY, `+${formatNum(earned)} G`);
      }
      return true;
    }

    function interactPlot(index, event, allowUnlock = true) {
      if (index >= state.unlockedPlots) {
        if (!allowUnlock) return;
        const cost = PLOT_COSTS[index];
        if (state.money >= cost && index === state.unlockedPlots) {
          state.money -= cost;
          state.unlockedPlots++;
          saveGame();
          render();
        }
        return;
      }

      const plot = state.plots[index];
      if (plot.cropId === null) {
        plantAt(index);
      } else if (plot.progress >= 1) {
        harvestAt(index, event.clientX, event.clientY);
        render();
      }
    }

    function doPrestige() {
      const gain = calculateGainTokens();
      if (gain <= 0) return;

      const nextTokens = state.tokens + gain;
      const nextPrestigeCount = state.prestigeCount + 1;
      const nextTotalHarvest = state.totalHarvest;
      const nextPerks = { ...state.tokenPerks };
      const initialMoney = 10 + nextPerks.startCashLv * 120;

      state = createDefaultState();
      state.tokens = nextTokens;
      state.prestigeCount = nextPrestigeCount;
      state.totalHarvest = nextTotalHarvest;
      state.tokenPerks = nextPerks;
      state.money = initialMoney;
      state.runEarned = initialMoney;

      if (state.tokenPerks.goldenCrop) {
        state.selectedCrop = "golden";
      }

      saveGame();
      render();
      spawnFloatText(window.innerWidth / 2 - 60, 120, `🪙 +${gain} トークン獲得！`);
    }

    function renderMarketHeader() {
      document.getElementById("marketIndex").textContent = marketIndex.toFixed(2);
      document.getElementById("btcRef").textContent = btcPriceUsd.toLocaleString();

      const moodEl = document.getElementById("marketMood");
      if (marketIndex >= 1.35) {
        moodEl.textContent = "🔥 大高騰タイム！";
        moodEl.className = "m-boom";
      } else if (marketIndex <= 0.75) {
        moodEl.textContent = "❄️ 相場下落中";
        moodEl.className = "m-crash";
      } else {
        moodEl.textContent = "⚖️ 通常相場";
        moodEl.className = "m-normal";
      }
    }

    function renderSeeds() {
      const container = document.getElementById("seedSelector");
      container.innerHTML = "";

      for (const crop of CROPS) {
        if (crop.requiresTokenCrop && !state.tokenPerks.goldenCrop) {
          continue;
        }

        const unlocked = isCropAvailable(crop);
        const btn = document.createElement("button");
        btn.className = "seed-btn" + (state.selectedCrop === crop.id ? " active" : "") + (crop.requiresTokenCrop ? " golden" : "");

        if (unlocked) {
          const sellPrice = getCropSellPrice(crop);
          btn.innerHTML = `${crop.grownIcon} ${crop.name} (${crop.growTime}秒)<br>種:${formatNum(crop.seedCost)}G / 売:${formatNum(sellPrice)}G`;
          btn.onpointerdown = (e) => {
            e.preventDefault();
            state.selectedCrop = crop.id;
            render();
          };
        } else {
          btn.innerHTML = `🔒 ${crop.name}<br>解放: ${formatNum(crop.unlockCost)}G`;
          btn.disabled = state.money < crop.unlockCost;
          btn.onpointerdown = (e) => {
            e.preventDefault();
            if (btn.disabled) return;
            if (state.money >= crop.unlockCost) {
              state.money -= crop.unlockCost;
              state.unlockedCrops.push(crop.id);
              state.selectedCrop = crop.id;
              saveGame();
              render();
            }
          };
        }
        container.appendChild(btn);
      }
    }

    function renderFarm() {
      const grid = document.getElementById("farmGrid");
      grid.innerHTML = "";

      for (let i = 0; i < 9; i++) {
        const cell = document.createElement("div");
        const isUnlocked = i < state.unlockedPlots;

        if (!isUnlocked) {
          cell.className = "plot locked";
          const cost = PLOT_COSTS[i];
          if (i === state.unlockedPlots) {
            cell.innerHTML = `🔒 畑を拡張<br><strong>${formatNum(cost)} G</strong>`;
          } else {
            cell.innerHTML = `🔒 未開拓`;
          }
        } else {
          const plot = state.plots[i];
          const isReady = plot.cropId && plot.progress >= 1;
          const isGrowing = plot.cropId && plot.progress < 1;
          cell.className = "plot" + (isReady ? " ready" : isGrowing ? " growing" : "");

          if (!plot.cropId) {
            cell.innerHTML = `<div class="crop-icon" style="opacity:0.35;">🟫</div><div class="crop-label">クリックで植える</div>`;
          } else {
            const crop = getCrop(plot.cropId);
            const pct = Math.floor(plot.progress * 100);
            const icon = isReady ? crop.grownIcon : crop.seedIcon;
            const label = isReady ? "✨クリックで収穫" : `${crop.name} ${pct}%`;
            cell.innerHTML = `
              <div class="crop-icon">${icon}</div>
              <div class="crop-label">${label}</div>
              <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
            `;
          }
        }

        cell.onpointerdown = (e) => {
          e.preventDefault();
          interactPlot(i, e, true);
        };
        cell.onpointerenter = (e) => {
          if (isPointerDown) interactPlot(i, e, false);
        };
        grid.appendChild(cell);
      }
    }

    function renderUpgrades() {
      const list = document.getElementById("upgradeList");
      list.innerHTML = "";

      const fertCost = Math.round(35 * Math.pow(1.8, state.upgrades.fertilizer));
      const marketCost = Math.round(50 * Math.pow(1.85, state.upgrades.market));
      const planterCost = 550;
      const harvesterCost = 1400;

      const items = [
        {
          title: `🧪 特製肥料 Lv.${state.upgrades.fertilizer}`,
          desc: "すべての野菜の成長スピードが +12% アップ",
          cost: fertCost,
          bought: false,
          buy: () => {
            if (state.money >= fertCost) {
              state.money -= fertCost;
              state.upgrades.fertilizer++;
            }
          }
        },
        {
          title: `🏪 直売所ブランド Lv.${state.upgrades.market}`,
          desc: "収穫した野菜の基礎売値が +15% アップ",
          cost: marketCost,
          bought: false,
          buy: () => {
            if (state.money >= marketCost) {
              state.money -= marketCost;
              state.upgrades.market++;
            }
          }
        },
        {
          title: "🤖 自動種まきドローン",
          desc: "空いた畑に選択中の種を自動で植える",
          cost: planterCost,
          bought: state.upgrades.autoPlanter > 0,
          buy: () => {
            if (state.money >= planterCost && !state.upgrades.autoPlanter) {
              state.money -= planterCost;
              state.upgrades.autoPlanter = 1;
            }
          }
        },
        {
          title: "🚜 自動収穫ロボット",
          desc: "育ちきった野菜を自動で収穫してお金にする",
          cost: harvesterCost,
          bought: state.upgrades.autoHarvester > 0,
          buy: () => {
            if (state.money >= harvesterCost && !state.upgrades.autoHarvester) {
              state.money -= harvesterCost;
              state.upgrades.autoHarvester = 1;
            }
          }
        }
      ];

      for (const item of items) {
        const row = document.createElement("div");
        row.className = "upgrade-item";
        row.innerHTML = `
          <div class="up-info">
            <div class="up-title">${item.title}</div>
            <div class="up-desc">${item.desc}</div>
          </div>
        `;
        const btn = document.createElement("button");
        btn.className = "buy-btn";
        if (item.bought) {
          btn.textContent = "導入済み";
          btn.disabled = true;
        } else {
          btn.textContent = `${formatNum(item.cost)} G`;
          btn.disabled = state.money < item.cost;
          btn.onpointerdown = (e) => {
            e.preventDefault();
            if (btn.disabled) return;
            item.buy();
            saveGame();
            render();
          };
        }
        row.appendChild(btn);
        list.appendChild(row);
      }
    }

    function renderTokenShop() {
      const req = getPrestigeRequirement();
      const gain = calculateGainTokens();

      document.getElementById("prestigeReq").textContent = formatNum(req);
      document.getElementById("runEarned").textContent = formatNum(state.runEarned);
      document.getElementById("gainTokens").textContent = formatNum(gain);

      const prestigeBtn = document.getElementById("prestigeBtn");
      prestigeBtn.disabled = gain <= 0;
      prestigeBtn.textContent = gain > 0
        ? `転生して ${gain} 枚のトークンを獲得する`
        : `転生するには ${formatNum(req)} G 稼ごう`;

      const shopList = document.getElementById("tokenShopList");
      shopList.innerHTML = "";

      const startCashCost = 1 + state.tokenPerks.startCashLv;

      const perks = [
        {
          title: "👑 黄金イモの種を解禁",
          desc: "転生後も使える高単価の特別作物を解放（基礎売値360G×倍率）",
          cost: 3,
          bought: Boolean(state.tokenPerks.goldenCrop),
          onBuy: () => {
            state.tokens -= 3;
            state.tokenPerks.goldenCrop = true;
            state.selectedCrop = "golden";
          }
        },
        {
          title: "⚡ 超効率ドローン（自動化1.35倍）",
          desc: "自動種まき＆自動収穫の動作スピードが1.35倍になる",
          cost: 4,
          bought: Boolean(state.tokenPerks.fastDrone),
          onBuy: () => {
            state.tokens -= 4;
            state.tokenPerks.fastDrone = true;
          }
        },
        {
          title: `💼 転生初期資金 Lv.${state.tokenPerks.startCashLv}`,
          desc: `転生直後の所持金を +120 G 増やす（現在 +${state.tokenPerks.startCashLv * 120} G）`,
          cost: startCashCost,
          bought: false,
          onBuy: () => {
            state.tokens -= startCashCost;
            state.tokenPerks.startCashLv++;
            state.money += 120;
            state.runEarned += 120;
          }
        }
      ];

      for (const perk of perks) {
        const row = document.createElement("div");
        row.className = "upgrade-item";
        row.innerHTML = `
          <div class="up-info">
            <div class="up-title">${perk.title}</div>
            <div class="up-desc">${perk.desc}</div>
          </div>
        `;
        const btn = document.createElement("button");
        btn.className = "buy-btn token-btn";
        if (perk.bought) {
          btn.textContent = "解禁済み";
          btn.disabled = true;
        } else {
          btn.textContent = `🪙 ${perk.cost}枚`;
          btn.disabled = state.tokens < perk.cost;
          btn.onpointerdown = (e) => {
            e.preventDefault();
            if (btn.disabled) return;
            if (state.tokens >= perk.cost) {
              perk.onBuy();
              saveGame();
              render();
            }
          };
        }
        row.appendChild(btn);
        shopList.appendChild(row);
      }
    }

    function render() {
      document.getElementById("money").textContent = formatNum(state.money);
      document.getElementById("tokens").textContent = formatNum(state.tokens);
      document.getElementById("prestigeCount").textContent = formatNum(state.prestigeCount);
      document.getElementById("totalHarvest").textContent = formatNum(state.totalHarvest);
      document.getElementById("speedMult").textContent = getSpeedMultiplier().toFixed(2);
      document.getElementById("priceMult").textContent = getPriceMultiplier().toFixed(2);
      renderMarketHeader();
      renderSeeds();
      renderFarm();
      renderUpgrades();
      renderTokenShop();
    }

    document.getElementById("prestigeBtn").onpointerdown = (e) => {
      e.preventDefault();
      if (calculateGainTokens() > 0) doPrestige();
    };

    document.getElementById("resetSaveBtn").onpointerdown = (e) => {
      e.preventDefault();
      localStorage.removeItem(SAVE_KEY);
      location.reload();
    };

    loadGame();
    render();
    fetchBtcReference();

    let tickCount = 0;
    let autoAccumulator = 0;

    setInterval(() => {
      const dt = 0.1;
      const speed = getSpeedMultiplier();
      const autoRate = state.tokenPerks.fastDrone ? 0.65 : 0.45;
      autoAccumulator += autoRate;
      const runAutoStep = autoAccumulator >= 1;
      if (runAutoStep) autoAccumulator -= 1;

      for (let i = 0; i < state.unlockedPlots; i++) {
        const plot = state.plots[i];
        if (plot.cropId && plot.progress < 1) {
          const crop = getCrop(plot.cropId);
          plot.progress = Math.min(1, plot.progress + (dt * speed) / crop.growTime);
        }
        if (runAutoStep && plot.cropId && plot.progress >= 1 && state.upgrades.autoHarvester) {
          harvestAt(i);
        }
        if (runAutoStep && !plot.cropId && state.upgrades.autoPlanter) {
          plantAt(i, true);
        }
      }

      tickCount++;
      // 8秒ごとに市場トレンド指数の波を更新
      if (tickCount % 80 === 0) {
        stepMarketIndex();
      }
      if (tickCount % 20 === 0) saveGame();

      render();
    }, 100);
  </script>
</body>
</html>
